# grip_presets.yaml — 프리셋 그립 포즈 정의 (단일 진실 소스)
#
# 이 파일 하나에서
#   - SRDF 의 <group_state> (scripts/make_srdf.py)
#   - dexhand_bringup 의 grip_preset_node (프리셋 실행 서비스)
# 가 모두 생성/구동된다. 포즈를 고치려면 여기만 고치면 된다.
#
# 값의 단위는 rad. 손가락 순서는 항상 Index, Middle, Ring, Pinky.
#   yaw   : R_<F>_Yaw   범위 -0.30 ~ +0.30
#           FK 로 확인한 실제 방향: +yaw 는 네 손끝을 모두 -y(소지쪽)로 민다.
#           따라서 '벌리기'는 검지 -, 소지 + 로 줘야 한다. 부호를 반대로 두면
#           손가락끼리 부딪힌다 (check_presets.py 가 잡아낸다).
#   pitch : R_<F>_Pitch 범위  0.0   ~ +1.309 (+ = MCP 굽힘)  (2026-08-19: URDF 한계 0.95 -> 1.10. 단 모델 자기충돌(너클<->손바닥) 때문에 프리셋 상한은 검지/중지/약지 1.05, 소지 0.95)
#           원본 CAD 한계는 1.309(75deg)지만 현재 서보 스팬(450us)으로는 거기까지
#           못 간다. 실측해서 넓히기 전까지 URDF 한계를 0.95 로 잠가 두었다.
#
# 엄지와 PIP/DIP 텐던이 없으므로 "핀치" 계열은 넣지 않았다.
# 이 하드웨어로 물리적으로 불가능한 포즈를 프리셋에 넣으면 GUI 가 거짓말을 하게 된다.

presets:
  open:
    description: "완전 폄 (홈 자세)"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [0.00, 0.00, 0.00, 0.00]

  close:
    description: "너클 굽힘 (안전 마진 남긴 파지)"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [1.00, 1.00, 1.00, 0.90]

  fist:
    description: "최대 굽힘"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [1.05, 1.05, 1.05, 0.95]

  hook:
    description: "갈고리 (손잡이 걸기)"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [1.03, 1.03, 1.03, 0.93]

  spread:
    description: "부채꼴 벌리기 (yaw 단독 검증용)"
    yaw:   [-0.28, -0.09, 0.09, 0.28]
    pitch: [0.00, 0.00, 0.00, 0.00]

  together:
    description: "모으기 (0.10 이 자기충돌 없는 최대치 — 스캔으로 확인)"
    # 0.12 부터 소지-약지 중절이 서로 파고든다. 손가락 사이 간격이 원래 좁아서
    # '모으기'는 벌리기(0.28 까지 여유)보다 훨씬 일찍 막힌다.
    yaw:   [0.10, 0.033, -0.033, -0.10]
    pitch: [0.00, 0.00, 0.00, 0.00]

  count_1:
    description: "검지만 폄"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [0.00, 1.05, 1.05, 0.95]

  count_2:
    description: "검지, 중지 폄 (V, 살짝 벌림)"
    yaw:   [-0.16, 0.16, 0.00, 0.00]
    pitch: [0.00, 0.00, 1.05, 0.95]

  count_3:
    description: "검지, 중지, 약지 폄"
    yaw:   [-0.10, 0.00, 0.10, 0.00]
    pitch: [0.00, 0.00, 0.00, 0.95]

  count_4:
    description: "네 손가락 다 폄 + 벌림"
    yaw:   [-0.20, -0.07, 0.07, 0.20]
    pitch: [0.00, 0.00, 0.00, 0.00]

  cylinder_grip:
    description: "원통 파지 (병, 손잡이)"
    yaw:   [-0.04, -0.01, 0.01, 0.04]
    pitch: [0.97, 1.05, 1.05, 0.87]

  wave_ready:
    description: "웨이브 시작 자세 (t4 테스트 대응)"
    yaw:   [0.00, 0.00, 0.00, 0.00]
    pitch: [0.79, 0.40, 0.00, 0.36]
