# moveit_controllers.yaml
#
# MoveIt 이 계획한 궤적을 넘길 컨트롤러 정의.
#
# ros2_control 을 쓰지 않는다. 이유:
#   - 아두이노가 이미 램프(속도제한), 클램핑, 워치독, EEPROM 캘리브레이션을 다 갖고 있다.
#     그 위에 ros2_control 하드웨어 인터페이스를 얹으면 같은 로직이 두 겹이 되고,
#     둘 중 어느 쪽이 잘랐는지 알 수 없게 된다.
#   - 서보에 위치 피드백이 없다. ros2_control 의 read() 가 돌려줄 실제값이 없으므로
#     결국 명령값을 그대로 되돌려주는 껍데기가 된다.
#   - C++ 플러그인 하나가 빌드에서 깨지면 GUI 전체가 안 뜬다.
# 그래서 dexhand_bringup 의 hand_driver_node 가 FollowJointTrajectory 액션 서버를
# 직접 열고, 그 안에서 시리얼 스트리밍을 한다.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - hand_controller

  hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - R_Index_Yaw
      - R_Index_Pitch
      - R_Middle_Yaw
      - R_Middle_Pitch
      - R_Ring_Yaw
      - R_Ring_Pitch
      - R_Pinky_Yaw
      - R_Pinky_Pitch
